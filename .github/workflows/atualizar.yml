name: Atualizar dados

on:
  schedule:
    # 07:17 em Brasília, de terça a sábado: pega o fechamento do dia útil anterior
    - cron: "17 10 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Baixar fontes, ajustar curvas e gerar a página
        run: bash pipeline/atualizar.sh

      - name: Publicar se houver dado novo
        run: |
          if git diff --quiet -- index.html data/anbima && [ -z "$(git ls-files --others --exclude-standard data/anbima)" ]; then
            echo "Sem dados novos."
            exit 0
          fi
          ate=$(sed -n 2p build/td_source.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/anbima
          git commit -m "Atualiza dados até ${ate}"
          git push
